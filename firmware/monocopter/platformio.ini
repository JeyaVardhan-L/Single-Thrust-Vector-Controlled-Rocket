; Phase 1 monocopter flight software (Teensy 4.1).  Build: pio run   Upload: pio run -t upload
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 115200
build_flags =
  -std=gnu++17
  -I../lib/tvc_core
  -I../lib/tvc_hal
  -DUSB_SERIAL
