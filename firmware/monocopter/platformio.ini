; Phase 1 monocopter flight software (ESP32-S3, no IMU, phone control over Wi-Fi).  Build: pio run   Upload: pio run -t upload
[env:esp32s3]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
  -std=gnu++17
  -I../lib/tvc_core
  -DARDUINO_USB_CDC_ON_BOOT=1
