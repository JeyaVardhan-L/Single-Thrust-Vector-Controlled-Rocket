<html lang="en">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="icon" href="data:,">

</head>
<body>
<header class="topbar"><a class="brand" href="../index.html">TVC Rocket / Open build guide</a><nav><a href="../index.html">Home</a><a href="rocket.html">Rocket</a><a href="monocopter.html">Monocopter</a><a href="assembly.html?model=monocopter">Build</a><a href="control.html">Control</a><a href="gimbal.html">Gimbal</a><a href="pid.html">PID</a><a href="sizing.html">Sizing</a><a href="wiring.html">Wiring</a><a href="parts.html" class="on">Parts</a><a href="doc.html?p=docs/README.md">Docs</a></nav><a class="cta" href="assembly.html?model=monocopter">Start building<i>/</i></a></header>
<div class="app two">
  <aside class="side left" id="left">
    <h3>Printable parts <small id="count"></small></h3>
    <div class="btn-row" id="tabs" style="margin-top:0"><button data-v="monocopter">1 · Monocopter</button><button data-v="rocket">2 · Rocket</button></div>
    <p style="font-size:14px;margin:0 0 14px" id="order"></p>
    <div class="btn-row"><a class="btn primary" id="zip" href="#" download>Download the set (zip)</a></div>
    <ul class="partlist" id="list"></ul>
    <h3>Selected part</h3>
    <div id="info" style="font-size:14px"></div>
    <div class="btn-row"><a class="btn" id="dl" href="#">Download this STL</a><a class="btn" id="full" href="#">Print list and hardware</a></div>
  </aside>
  <main class="stage" id="stage">
    <div class="badge"><b id="title">Printable parts</b>drag to orbit · right-drag to pan · wheel to zoom</div>
    <div class="hint" id="dims"></div>
  </main>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/RoomEnvironment.js';

const $ = (s) => document.querySelector(s);
const stage = $('#stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const th = () => TVCTheme.three();
scene.background = new THREE.Color(th().bg);
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(200, 400, 250); scene.add(key);
const camera = new THREE.PerspectiveCamera(35, 1, 1, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.screenSpacePanning = true; controls.zoomToCursor = true; controls.maxPolarAngle = Math.PI * 0.985;
let grid = new THREE.GridHelper(300, 30, th().gridMajor, th().grid); scene.add(grid);
const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.55, metalness: 0.05 });
const edgeMat = new THREE.LineBasicMaterial({ color: 0x000000 });
const partColor = () => (TVCTheme.get() === 'dark' ? 0xd9d4ca : 0xffffff);
mat.color.setHex(partColor());
let mesh = null;

addEventListener('themechange', () => {
  const c = th(); scene.background.setHex(c.bg); mat.color.setHex(partColor());
  const s = grid.scale.x, y = grid.position.y; scene.remove(grid); grid.geometry.dispose();
  grid = new THREE.GridHelper(300, 30, c.gridMajor, c.grid); grid.scale.setScalar(s); grid.position.y = y; scene.add(grid);
});
function fit() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(fit).observe(stage); fit();
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();

/** Binary STL reader: 80-byte header, uint32 triangle count, 50 bytes per triangle. */
function parseSTL(buf) {
  const dv = new DataView(buf);
  const n = dv.getUint32(80, true);
  const pos = new Float32Array(n * 9);
  for (let t = 0; t < n; t++) {
    const o = 84 + t * 50 + 12;
    for (let k = 0; k < 9; k++) pos[t * 9 + k] = dv.getFloat32(o + k * 4, true);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return g;
}

async function show(p) {
  document.querySelectorAll('#list li').forEach((li) => li.classList.toggle('sel', li.dataset.id === p.id));
  $('#title').textContent = p.name;
  $('#info').innerHTML = `<div class="mono" style="font-size:10px;text-transform:uppercase;color:var(--muted)">${p.id}</div>
    <p style="margin:6px 0">${p.note}</p>
    <table style="font-size:13px"><tr><th>Quantity</th><td>${p.qty}</td></tr><tr><th>Material</th><td>${p.material}</td></tr><tr><th>Size</th><td>${p.size_mm.join(' × ')} mm</td></tr><tr><th>Volume</th><td>${p.volume_cm3} cm³</td></tr><tr><th>List ID</th><td>${p.bom}</td></tr></table>`;
  $('#dl').href = '../' + p.file; $('#dl').setAttribute('download', p.id + '.stl');
  $('#dims').textContent = p.size_mm.join(' × ') + ' mm';
  const geo = parseSTL(await (await fetch('../' + p.file)).arrayBuffer());
  if (mesh) { scene.remove(mesh); mesh.children.forEach((c) => c.geometry.dispose()); }
  geo.rotateX(-Math.PI / 2);                       // STL z (up on the bed) -> three.js y
  mesh = new THREE.Group();
  mesh.add(new THREE.Mesh(geo, mat));
  mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 35), edgeMat));
  scene.add(mesh);
  geo.computeBoundingBox();
  const b = geo.boundingBox, size = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3());
  const r = Math.max(size.x, size.y, size.z);
  grid.scale.setScalar(Math.max(1, r / 150)); grid.position.y = b.min.y - 0.05;
  controls.target.copy(c);
  camera.position.copy(c).add(new THREE.Vector3(0.9, 0.75, 1.15).multiplyScalar(r * 1.45));
  camera.near = r / 50; camera.far = r * 30; camera.updateProjectionMatrix();
}

const manifest = await (await fetch('../hardware/cad/parts.json')).json();
const qs = new URLSearchParams(location.search);
const ORDER = {
  monocopter: 'Step 1 of the build line: print and build the monocopter first. Binary STL, millimetres, in print orientation; a 220 × 220 mm bed is enough.',
  rocket: 'Step 2 of the build line: print these after the monocopter has flown. Binary STL, millimetres, in print orientation; a 220 × 220 mm bed is enough.',
};
const DOCS = { monocopter: 'docs/phase1-monocopter/printable-parts.md', rocket: 'docs/phase2-rocket/printable-parts.md' };
let vehicle = qs.get('v') === 'rocket' || (manifest.parts.find((p) => p.id === qs.get('part')) || {}).vehicle === 'rocket' ? 'rocket' : 'monocopter';
function list(v) {
  vehicle = v;
  const parts = manifest.parts.filter((p) => p.vehicle === v);
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.v === v));
  $('#count').textContent = `${parts.length} files · ${parts.reduce((a, p) => a + p.qty, 0)} pieces`;
  $('#order').textContent = ORDER[v];
  $('#zip').href = '../' + manifest.zips[v]; $('#zip').setAttribute('download', manifest.zips[v].split('/').pop());
  $('#full').href = 'doc.html?p=' + DOCS[v];
  $('#list').innerHTML = parts.map((p) => `<li data-id="${p.id}"><span class="dot"></span>${p.name}<span class="mono" style="margin-left:auto;font-size:10px">×${p.qty}</span></li>`).join('');
  document.querySelectorAll('#list li').forEach((li) => li.addEventListener('click', () => show(parts.find((p) => p.id === li.dataset.id))));
  return parts;
}
document.querySelectorAll('#tabs button').forEach((b) => b.addEventListener('click', async () => {
  const parts = list(b.dataset.v); await show(parts[0]);
  history.replaceState(null, '', '?v=' + b.dataset.v);
}));
const initial = list(vehicle);
await show(initial.find((p) => p.id === qs.get('part')) || initial[0]);
window.__ready = true;
</script>
</body>
</html>
