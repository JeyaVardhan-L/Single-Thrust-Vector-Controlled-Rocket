name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: JS tests (simulation, mixer, printable parts)
        run: node --test
      - name: STL files match the parametric source
        run: npm run cad:check
      - name: Firmware core host tests (g++)
        run: node scripts/test-firmware.mjs
      - name: BOM tables are up to date
        run: |
          node scripts/gen-bom.mjs
          git diff --exit-code hardware/bom docs/phase1-monocopter/02-bom.md docs/phase2-rocket/02-bom.md
      - name: UI audit (console errors, requests, text contrast)
        run: |
          npm run audit
        continue-on-error: true
